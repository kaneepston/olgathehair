<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="utf-8"/>
    <meta http-equiv="refresh" content="0; url=/pl/">
    <link rel="canonical" href="https://olgathehair.com/pl/">
    <script>
        // Immediate redirect to Polish version
        (function() {
            var path = window.location.pathname;
            // Only redirect if we're on root, not already in a subdirectory
            if (path === '/' || path === '/index.html' || path.endsWith('index.html')) {
                if (!window.location.href.includes('/pl/') && !window.location.href.includes('/en/')) {
                    window.location.replace('/pl/');
                }
            }
        })();
    </script>
</head>
<body>
    <p>Przekierowywanie do <a href="/pl/">wersji polskiej</a>...</p>
    <script>
        // Fallback redirect
        setTimeout(function() {
            if (!window.location.href.includes('/pl/') && !window.location.href.includes('/en/')) {
                window.location.href = '/pl/';
            }
        }, 100);
    </script>
</body>
</html>
